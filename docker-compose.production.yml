# Production overlay — production on-prem server.
# Used by: docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --build

services:
  fe:
    image: zyta-fe:production
    container_name: zyta-fe
    restart: always
    build:
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_AUTH_GUARD_ENABLED: "true"
        VITE_REDIRECT_ON_401: "true"
    ports:
      - "${FE_PORT:-80}:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    image: zyta-api:production
    container_name: zyta-api
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
