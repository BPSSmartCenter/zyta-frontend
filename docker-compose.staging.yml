# Staging overlay — dev/staging server.
# Used by: docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --build

services:
  fe:
    image: zyta-fe:staging
    container_name: zyta-fe-staging
    restart: unless-stopped
    build:
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_AUTH_GUARD_ENABLED: "true"
        VITE_REDIRECT_ON_401: "true"
    ports:
      - "${FE_PORT:-80}:80"

  api:
    image: zyta-api:staging
    container_name: zyta-api-staging
    restart: unless-stopped
