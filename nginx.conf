# Container-side nginx — serves the SPA only.
# Host-side nginx on the server handles SSL, /api proxying, and domain routing
# before traffic reaches this container.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Long cache for hashed Vite assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every unknown path returns index.html so React Router can route
    location / {
        try_files $uri $uri/ /index.html;
    }
}
