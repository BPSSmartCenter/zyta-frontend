# Local dev overlay — runs on a developer's machine.
# Use port 8080 to avoid clashing with anything bound to :80.
# Prefer `npm run dev` for day-to-day work; this overlay is for parity testing
# of the dockerized build before pushing.

services:
  fe:
    image: zyta-fe:local
    container_name: zyta-fe-local
    restart: "no"
    build:
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_AUTH_GUARD_ENABLED: "true"
        VITE_REDIRECT_ON_401: "true"
    ports:
      - "8080:80"

  api:
    image: zyta-api:local
    container_name: zyta-api-local
    restart: "no"
